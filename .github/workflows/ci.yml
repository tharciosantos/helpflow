name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      # Banco efêmero do serviço acima: nada toca o Supabase de produção.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpflow_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/helpflow_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      CYPRESS_TEST_SECRET: ci-only-cypress-secret
      # Sem Upstash o rate limiter cai para memória; sem e-mail/OAuth os
      # fluxos de reset e GitHub ficam inertes (não são cobertos pelo E2E).
      UPSTASH_REDIS_REST_URL: ''
      UPSTASH_REDIS_REST_TOKEN: ''
      EMAIL_USER: ''
      EMAIL_PASS: ''
      AUTH_GITHUB_ID: ''
      AUTH_GITHUB_SECRET: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npx next build

      - name: Start server
        run: |
          # nohup + disown: o processo sobrevive ao fim do step e continua
          # disponível para os passos seguintes.
          nohup npx next start --port 3000 > /tmp/next.log 2>&1 &
          disown
          # Aguarda o servidor responder (sem dependência extra como wait-on).
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              echo "Servidor pronto após ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Servidor não respondeu em 120s. Log:"
          cat /tmp/next.log
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail --silent http://localhost:3000/api/health
          echo

      - name: Run Cypress E2E
        run: npm run cypress:run

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/next.log || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
